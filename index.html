const imp=(j,pub)=>{j={...j};delete j.key_ops;delete j.ext;return crypto.subtle.importKey('jwk',j,{name:'ECDH',namedCurve:'P-256'},false,pub?[]:['deriveBits'])};
async function setPriv(j){S.privj=j;S.pubj=pubOf(j);S.priv=await imp(j);S.kc={};S.dc2={}}
/* общий ключ диалога: ECDH(P-256) → HKDF → AES-GCM-256. Сервер видит только шифртекст */
async function sk(peer){if(!S.priv)return null;const pj=peer===S.id?JSON.stringify(S.pubj):usr(peer).pk;if(!pj)return null;const k0=peer+'|'+pj;if(S.kc[k0])return S.kc[k0];
const bits=await crypto.subtle.deriveBits({name:'ECDH',public:await imp(JSON.parse(pj),1)},S.priv,256),hk=await crypto.subtle.importKey('raw',bits,'HKDF',false,['deriveKey']);
return S.kc[k0]=await crypto.subtle.deriveKey({name:'HKDF',hash:'SHA-256',salt:new Uint8Array(32),info:te.encode('sirius-e2e-v1')},hk,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
/* облачный пароль → (proof для сервера | ключ сейфа). Это две разные половины одного PBKDF2, пароль на сервер не уходит */
async function vaultKey(pw,salt){const m=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveBits']),b=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:unb64(salt),iterations:KDF},m,512));
return{proof:hex(b.subarray(0,32)),key:await crypto.subtle.importKey('raw',b.slice(32),'AES-GCM',false,['encrypt','decrypt'])}}
async function api(p,b){const r=await fetch(S.base+p,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({u:S.id,t:S.tok,...b})});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.err||'Ошибка сервера');return j}
async function mkKeys(pw){const kp=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveBits']),j=await crypto.subtle.exportKey('jwk',kp.privateKey),salt=b64(crypto.getRandomValues(new Uint8Array(16))),k=await vaultKey(pw,salt);
await api('/api/rec/set',{salt,proof:k.proof,vault:await aesEnc(k.key,te.encode(JSON.stringify(j)))});try{localStorage.spk=JSON.stringify(j)}catch(e){}await setPriv(j);return S.pubj}
/* шифрование/расшифровка сообщений (личные чаты и «Избранное»; группы и каналы — пока открытым текстом) */
async function seal(peer,body,nm){if(!E2()||S.G[peer])return nm!==undefined?{body,nm}:{body};if(peer==='bot')throw new Error('Бот не принимает сообщения');
const k=await sk(peer);if(!k)throw new Error(peer===S.id?'Ключи шифрования не найдены':'У собеседника не включено шифрование — пусть обновит приложение');
return{body:await aesEnc(k,te.encode(JSON.stringify({b:body,nm}))),e:1}}

await col('msgs').doc('m'+Date.now()+S.id.slice(-4)+Math.random().toString(36).slice(2,4)).set({c:ck(S.id,peer),from:S.id,t:Date.now(),kind,rx:{},rd:peer===S.id?1:0,...r,...s})}
async function dm(m){if(!m.e)return m;try{const peer=m.c.split('_').find(x=>x!==S.id)||S.id,key=await sk(peer);if(!key)throw 0;const c=m.id+'|'+m.body;let p=S.dc2[c];if(!p){p=JSON.parse(td.decode(await aesDec(key,m.body)));S.dc2[c]=p}return{...m,body:p.b,nm:p.nm}}catch(e){return{...m,kind:'text',body:'🔒 Не удалось расшифровать сообщение'}}}
async function safety(o){const A=mu().pk,B=usr(o).pk;if(!A||!B)return toast('У собеседника не включено шифрование');const h=new Uint8Array(await crypto.subtle.digest('SHA-256',te.encode([A,B].sort().join('|'))));let s=[];for(let i=0;i<6;i++)s.push(String(((h[i*2]<<8)|h[i*2+1])%100000).padStart(5,'0'));
